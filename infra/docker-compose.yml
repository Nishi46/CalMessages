services:
  postgres-consumer:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: tally_consumer
      POSTGRES_USER: tally
      POSTGRES_PASSWORD: tally_dev
    ports:
      - '5434:5432'
    volumes:
      - postgres_consumer_data:/var/lib/postgresql/data

  # Separate instance, not a second schema on the box above — the physical
  # separation from 04 §10 holds even in local dev.
  postgres-clinic:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: tally_clinic
      POSTGRES_USER: tally
      POSTGRES_PASSWORD: tally_dev
    ports:
      - '5433:5432'
    volumes:
      - postgres_clinic_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'

  # S3-compatible bucket for local dev, per 04 §1.
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: tally
      MINIO_ROOT_PASSWORD: tally_dev_secret
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio_data:/data

volumes:
  postgres_consumer_data:
  postgres_clinic_data:
  minio_data:
